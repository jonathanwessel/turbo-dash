<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1a0b3d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Turbo Dash</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- race HUD -->
  <div id="hud" hidden>
    <div class="hud-pos"><span id="h-pos">6</span><small id="h-suffix">th</small></div>
    <div class="hud-mid">
      <div class="hud-lap">LAP <span id="h-lap">1</span>/<span id="h-laps">2</span></div>
      <div id="h-track"></div>
    </div>
    <div class="hud-coins">🪙 <span id="h-coins">0</span></div>
    <button id="btn-pause" class="hud-btn" aria-label="Pause">⏸</button>
  </div>
  <div id="countdown" hidden></div>
  <div id="controls" hidden>
    <button id="btn-left" class="steer" aria-label="Left">◀</button>
    <button id="btn-nitro" class="nitro" aria-label="Turbo"><span class="nitro-fill" id="nitro-fill"></span><span class="nitro-label">🚀</span></button>
    <button id="btn-right" class="steer" aria-label="Right">▶</button>
  </div>

  <!-- screens -->
  <section id="s-title" class="screen">
    <div class="logo"><span>TURBO</span><span>DASH</span></div>
    <button id="btn-play" class="big-btn go">▶ PLAY</button>
    <div class="ver" id="ver"></div>
  </section>

  <section id="s-result" class="screen dim" hidden>
    <div class="card result">
      <div class="trophy" id="r-trophy">🏆</div>
      <h1 id="r-title">1st PLACE!</h1>
      <div class="r-lines">
        <div>Prize <b>🪙 <span id="r-prize">0</span></b></div>
        <div>Road coins <b>🪙 <span id="r-road">0</span></b></div>
      </div>
      <div id="r-unlock" class="r-unlock" hidden></div>
      <div id="r-chests" class="r-chests">
        <div class="r-pick" id="r-pick">Pick a treasure chest!</div>
        <div class="row"><button class="chest" data-i="0">🎁</button><button class="chest" data-i="1">🎁</button><button class="chest" data-i="2">🎁</button></div>
      </div>
      <div id="r-btns" class="row" hidden>
        <button id="btn-again" class="big-btn">↻ Again</button>
        <button id="btn-next" class="big-btn go">Next ▶</button>
        <button id="btn-home" class="big-btn gold">🏠</button>
      </div>
    </div>
  </section>

  <section id="s-hub" class="screen" hidden>
    <div class="logo small"><span>TURBO</span><span>DASH</span></div>
    <div class="hub-btns">
      <button id="hub-race" class="tile go"><span class="ti">🏁</span>RACE</button>
      <button id="hub-garage" class="tile gold"><span class="ti">🔧</span>GARAGE<i class="badge" id="garage-badge" hidden>!</i></button>
      <button id="hub-gift" class="tile pink"><span class="ti">🎁</span>GIFT<i class="badge" id="gift-badge" hidden>!</i></button>
    </div>
  </section>

  <section id="s-tracks" class="screen panel" hidden>
    <div class="screen-head"><button class="back" data-back>◀</button><h2>Pick a track</h2></div>
    <div class="track-list" id="track-list"></div>
  </section>

  <section id="s-garage" class="screen panel" hidden>
    <div class="screen-head"><button class="back" data-back>◀</button><h2>Garage</h2></div>
    <div class="garage">
      <div class="g-left">
        <div class="g-show"><button id="g-prev" class="arrow" aria-label="Previous car">◀</button><canvas id="g-car" width="420" height="250"></canvas><button id="g-next" class="arrow" aria-label="Next car">▶</button></div>
        <div class="g-name" id="g-name">Zippy</div>
        <div class="g-stats" id="g-stats"></div>
        <button id="g-action" class="big-btn go">✔ Driving</button>
      </div>
      <div class="g-right" id="g-ups"></div>
    </div>
  </section>

  <section id="s-gift" class="screen dim" hidden>
    <div class="card gift">
      <div class="trophy" id="gift-icon">🎁</div>
      <h1>Free Gift!</h1>
      <div class="gift-day" id="gift-day">Day 1</div>
      <div class="r-coins">🪙 <span id="gift-amt">150</span></div>
      <button id="gift-take" class="big-btn gold">Collect!</button>
    </div>
  </section>

  <section id="s-pause" class="screen dim" hidden>
    <div class="card">
      <h1>Paused</h1>
      <div class="row">
        <button id="btn-resume" class="big-btn go">▶ Go!</button>
        <button id="btn-quit" class="big-btn">🏠 Home</button>
      </div>
    </div>
  </section>

  <div id="coinbar" class="coinbar" hidden>🪙 <span id="coin-n">0</span></div>
  <div id="topright" class="topright" hidden><button id="btn-music" class="icon-btn" aria-label="Music">🎵</button><button id="btn-sfx" class="icon-btn" aria-label="Sound">🔊</button><button id="btn-full" class="icon-btn" aria-label="Full screen">⛶</button></div>
  <canvas id="fx"></canvas>
  <div id="update" class="update" hidden>New version <b id="upd-v"></b> is ready! <button id="upd-go">Update</button></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
